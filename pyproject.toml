[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline_worksheet_reader"
version = "1.0.0"
description = "A reader for NGS pipeline worksheets used with the [provlab-bioinfo/ngs-pipeline-launcher](https://github.com/provlab-bioinfo/ngs-pipeline-launcher)."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11, <4"
authors = [
    { name = "Andrew Lindsay", email = "andrew.lindsay@albertaprecisionlabs.ca" },
]
dependencies = [
    "pandas==3.0.6",
    "openpyxl==3.1.5"
]

[project.urls]
Homepage = "https://github.com/provlab-bioinfo/pipeline-worksheet-reader"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "nox==2026.10.20"
]